name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        os: [ubuntu-22.04]
        ocaml-version: [4.14.1]
        node-version: [20.x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print Yarn cache
        id: print-yarn-cache
        run: echo "yarn-cache=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.print-yarn-cache.outputs.yarn-cache }}
          key: ${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock', '*/yarn.lock') }}

      - name: Install Yarn deps
        run: yarn install

      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true
          cache-prefix: "v1"

      - name: Install Opam deps
        run: opam install . --deps-only --with-test

      - name: Build PPX
        run: opam exec -- dune build

      - name: Build ReScript lib
        run: |
          cd lib
          yarn run build

      - name: Run PPX tests
        run: opam exec -- dune exec test.exe

      - name: Run integration tests
        run: |
          cd specs
          yarn run test

  build_macos:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel, macos-15]
        ocaml-version: [4.14.1]
        node-version: [20.x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Print Yarn cache
        id: print-yarn-cache
        run: echo "yarn-cache=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.print-yarn-cache.outputs.yarn-cache }}
          key: ${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock', '*/yarn.lock') }}

      - name: Install Yarn deps
        run: yarn install

      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true
          cache-prefix: "v1"

      - name: Install Opam deps
        run: opam install . --deps-only --with-test

      - name: Build PPX
        run: opam exec -- dune build

      - name: Build ReScript lib
        run: |
          cd lib
          yarn run build

      - name: Run PPX tests
        run: opam exec -- dune exec test.exe

      - name: Run integration tests
        run: |
          cd specs
          yarn run test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: _build/default/ppx/bin/bin.exe

  build_linux:
    name: Build on ${{ matrix.container-os }}
    runs-on: ${{ matrix.host-os }}
    strategy:
      matrix:
        host-os: [ubuntu-22.04]
        container-os: [linux-debian-bullseye]
        ocaml-version: [4.14.1]
        node-version: [20.x]
    container:
      image: debian:bullseye

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            git \
            unzip \
            bubblewrap
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
          dune-cache: true
          cache-prefix: "v2-bullseye"
      - name: Install Opam deps
        run: opam install . --deps-only --with-test
      - name: Build PPX
        run: opam exec -- dune build --profile static

      - name: Build ReScript lib
        run: |
          cd lib
          yarn run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.container-os }}
          path: _build/default/ppx/bin/bin.exe

  prepare_release:
    needs:
      - build_macos
      - build_linux
    name: Prepare release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Download macOS x86 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-15-intel
          path: _bin/darwin/intel

      - name: Download macOS ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-15
          path: _bin/darwin/arm

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-debian-bullseye
          path: _bin/linux


      - name: Move artifacts
        run: |
          mkdir -p _release/bin
          mv _bin/darwin/intel/bin.exe _release/bin/re-formality-ppx-darwin-x64.exe
          mv _bin/darwin/arm/bin.exe _release/bin/re-formality-ppx-darwin-arm64.exe
          mv _bin/linux/bin.exe _release/bin/re-formality-ppx-linux-x64.exe
          rm -rf _bin

      - name: Move lib files
        run: |
          mkdir -p _release/src
          cp README.md _release/README.md
          cp lib/rescript.json _release/rescript.json
          cp -a lib/src/. _release/src/
          cp .github/workflows/scripts/postinstall.js _release/postinstall.js
          node .github/workflows/scripts/write-package-json.js

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: _release
